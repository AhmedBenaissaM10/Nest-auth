name: CI Pipeline

on:
  workflow_dispatch: 

jobs:
    deploy:
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/main'
        steps:
            - name: Trigger Render deploy
              id: trigger
              run: |
                    response=$(curl -s -f -X POST \
                        --url "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
                        --header "Accept: application/json" \
                        --header "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}")
                    deploy_id=$(echo "$response" | jq -r '.id')
                    echo "Triggered deploy: $deploy_id"
                    echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"

            - name: Wait for deploy to go live
              run: |
                    deploy_id="${{ steps.trigger.outputs.deploy_id }}"
                    timeout=300
                    interval=10
                    elapsed=0

                    while [ "$elapsed" -lt "$timeout" ]; do
                        status=$(curl -s \
                        --url "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys/$deploy_id" \
                        --header "Accept: application/json" \
                        --header "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" | jq -r '.status')

                        echo "Current status: $status"

                        if [ "$status" = "live" ]; then
                        echo "Deploy succeeded."
                        exit 0
                        fi

                        case "$status" in
                        build_failed|update_failed|canceled|deactivated)
                            echo "Deploy failed with status: $status"
                            exit 1
                            ;;
                        esac

                        sleep "$interval"
                        elapsed=$((elapsed + interval))
                    done

                    echo "Timed out after ${timeout}s waiting for deploy."
                    exit 1
            - name: Get service URL
              run: |
                service_url=$(curl -s \
                    --url "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}" \
                    --header "Accept: application/json" \
                    --header "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" | jq -r '.serviceDetails.url')

                echo "🚀 Deployed to: $service_url" >> "$GITHUB_STEP_SUMMARY"
                echo "service_url=$service_url" >> "$GITHUB_OUTPUT"
