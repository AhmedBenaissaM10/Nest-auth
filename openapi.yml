openapi: 3.0.0
paths:
  /api:
    get:
      operationId: AppController_getHello
      parameters: []
      responses:
        '200':
          description: ''
      tags:
        - App
  /api/auth/signup:
    post:
      description: >-
        Creates the user, opens a session and sets the refresh token in an
        httpOnly cookie.
      operationId: AuthController_signup
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelopeDto'
                  - properties:
                      data:
                        $ref: '#/components/schemas/AuthResultDto'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      summary: Create an account
      tags:
        - Auth
  /api/auth/login:
    post:
      description: Opens a new session and sets the refresh token in an httpOnly cookie.
      operationId: AuthController_login
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelopeDto'
                  - properties:
                      data:
                        $ref: '#/components/schemas/AuthResultDto'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '401':
          description: Missing, invalid or expired credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      summary: Log in
      tags:
        - Auth
  /api/auth/refresh:
    post:
      description: >-
        Reads the refresh token from the cookie, rotates it (new cookie) and
        returns a new access token. Reusing an old refresh token revokes all
        sessions of the user.
      operationId: AuthController_refresh
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelopeDto'
                  - properties:
                      data:
                        $ref: '#/components/schemas/AccessTokenDto'
        '401':
          description: Missing, invalid or expired credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      security:
        - refresh-cookie: []
      summary: Get a new access token
      tags:
        - Auth
  /api/auth/logout:
    post:
      description: Revokes the current session and clears the refresh cookie.
      operationId: AuthController_logout
      parameters: []
      responses:
        '204':
          description: Session revoked, cookie cleared
      security:
        - refresh-cookie: []
      summary: Log out
      tags:
        - Auth
  /api/auth/me:
    get:
      operationId: AuthController_profile
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelopeDto'
                  - properties:
                      data:
                        $ref: '#/components/schemas/CurrentUserDto'
        '401':
          description: Missing, invalid or expired credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      security:
        - access-token: []
      summary: Get the current user (from the access token)
      tags:
        - Auth
  /api/auth/profile:
    get:
      description: Returns the profile of the logged-in user, read from the database.
      operationId: AuthController_getProfile
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelopeDto'
                  - properties:
                      data:
                        $ref: '#/components/schemas/PublicUserDto'
        '401':
          description: Missing, invalid or expired credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      security:
        - access-token: []
      summary: Get my profile
      tags:
        - Auth
    patch:
      description: A user can only change their own name.
      operationId: AuthController_updateProfile
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelopeDto'
                  - properties:
                      data:
                        $ref: '#/components/schemas/PublicUserDto'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '401':
          description: Missing, invalid or expired credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      security:
        - access-token: []
      summary: Update my profile
      tags:
        - Auth
  /api/auth/change-password:
    post:
      description: >-
        Requires the current password. Revokes every session (all devices), then
        opens a new one for this device.
      operationId: AuthController_changePassword
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelopeDto'
                  - properties:
                      data:
                        $ref: '#/components/schemas/AccessTokenDto'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '401':
          description: Missing, invalid or expired credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      security:
        - access-token: []
      summary: Change my password
      tags:
        - Auth
  /api/auth/account:
    delete:
      description: >-
        Requires the password. Deletes the user and all their sessions, and
        clears the refresh cookie.
      operationId: AuthController_deleteAccount
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountDto'
      responses:
        '204':
          description: Account deleted
        '400':
          description: Validation failed
          content:
