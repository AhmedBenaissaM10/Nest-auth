  /api/auth/google:
    get:
      description: >-
        Open this URL in the browser (not with fetch). Redirects to Google, then
        back to the callback.
      operationId: AuthController_googleAuth
      parameters: []
      responses:
        '302':
          description: Redirect to Google
      summary: Sign in with Google
      tags:
