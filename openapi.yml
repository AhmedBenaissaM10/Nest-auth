info:
  title: Auth API
  description: >-
    Authentication API: short-lived access token in the Authorization header,
    rotating refresh token in an httpOnly cookie.
  version: 1.0.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    access-token:
      scheme: bearer
      bearerFormat: JWT
      type: http
    refresh-cookie:
      type: apiKey
      in: cookie
      name: refresh_token
  schemas:
    ErrorResponseDto:
      type: object
      properties:
        success:
          type: boolean
          example: false
        statusCode:
          type: number
          example: 400
        message:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          example:
            - email must be an email
        path:
          type: string
          example: /auth/register
        method:
          type: string
          example: POST
        timestamp:
          type: string
          example: '2026-10-12T22:00:00.000Z'
      required:
        - success
        - statusCode
        - message
        - path
        - method
        - timestamp
    SuccessEnvelopeDto:
      type: object
      properties:
        success:
          type: boolean
          example: true
        statusCode:
          type: number
          example: 200
        path:
          type: string
          example: /auth/login
        method:
          type: string
          example: POST
        timestamp:
          type: string
          example: '2026-10-12T22:00:00.000Z'
      required:
        - success
        - statusCode
        - path
        - method
        - timestamp
    Role:
      type: string
      enum:
        - USER
        - ADMIN
    PublicUserDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 3f6c1c2e-8a1b-4d0e-9f3a-2b7c5d9e1a44
        name:
          type: string
          example: John Doe
        email:
          type: string
          format: email
          example: ahmed@example.com
        role:
          example: USER
          allOf:
            - $ref: '#/components/schemas/Role'
      required:
        - id
        - name
        - email
        - role
    AuthResultDto:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/PublicUserDto'
        accessToken:
          type: string
          description: >-
            JWT access token (15 minutes). Send it as "Authorization: Bearer
            <token>".
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      required:
        - user
        - accessToken
    RegisterDto:
      type: object
      properties:
        name:
