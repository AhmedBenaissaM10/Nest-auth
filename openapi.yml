  /api/auth/forgot-password:
    post:
      description: >-
        Sends a 6-digit one-time code to the given email if an account exists
        for it. The code expires after 10 minutes, and a new one can be
        requested after 60 seconds. The response is always the same, whether or
        not the email is registered, so it cannot be used to find out which
        emails have accounts.
      operationId: AuthController_forgotPassword
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelopeDto'
                  - properties:
                      data:
                        $ref: '#/components/schemas/AuthMessageResponseDto'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      summary: Request a password reset code
      tags:
        - Auth
  /api/auth/reset-password:
    post:
      description: >-
        Sets a new password using the 6-digit code sent by the forgot-password
        endpoint. The code is single-use, expires after 10 minutes, and is
        invalidated after 5 wrong attempts. All existing sessions are revoked
        after a successful reset.
      operationId: AuthController_resetPassword
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordDto'
      responses:
        '200':
