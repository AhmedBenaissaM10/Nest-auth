          maxLength: 50
          example: John Doe
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          minLength: 8
          maxLength: 100
          example: StrongPass123
      required:
        - name
        - email
        - password
    LoginDto:
      type: object
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          example: StrongPass123
      required:
        - email
        - password
    AccessTokenDto:
      type: object
      properties:
        accessToken:
          type: string
          description: New JWT access token (15 minutes).
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      required:
        - accessToken
    CurrentUserDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 3f6c1c2e-8a1b-4d0e-9f3a-2b7c5d9e1a44
        role:
          example: USER
          allOf:
            - $ref: '#/components/schemas/Role'
      required:
        - id
        - role
    UpdateProfileDto:
      type: object
      properties:
