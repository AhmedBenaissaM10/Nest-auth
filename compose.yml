name: Nest-Auth
services:
  db:
    image: postgres:16-alpine
    container_name: auth-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=auth_db
    ports:
      - 5432:5432
    volumes:
      - auth_db_data:/var/lib/postgressql/data
volumes:
  auth_db_data:
